spring.application.name=sgos
### Vinculacion de base de datos

spring.datasource.url=jdbc:mysql://localhost:3306/sgos
spring.datasource.username=root
spring.datasource.password=root

##controlador de conexion
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# Configuración JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600

# Administrador inicial
sgos.admin.email=${SGOS_ADMIN_EMAIL:}
sgos.admin.password=${SGOS_ADMIN_PASSWORD:}